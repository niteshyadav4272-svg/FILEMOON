<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

    <!-- moment cdn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>

    <!-- sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <div class="bg-gray-100 h-screen">
        <aside class="space-y-6  bg-linear-to-r from-cyan-500 to-blue-500  fixed top-0 left-0 h-full" id="sidebar"
            style="width:250px; transition: 0.3s; ">

            <!-- photo fullname email -->
            <div class="flex flex-col  items-center">
                <img src="../JS/k.png" id="pic" onclick="uploadImage()"
                    class="w-[80px] h-[80px] rounded-full object-cover">
                <h1 class="text-lg font-medium text-white capitalize" id="fullname"> </h1>
                <p class="text-sm text-gray-100 " id="email"></p>
            </div>
            <!-- photo fullname email end -->


            <div class="px-6 flex flex-col gap-4">

                <!-- dashboard start  -->
                <a href="/dashboard">
                    <button class="w-full bg-rose-400 text-white py-2.5 rounded-[4px] hover:bg-rose-600 ">
                        <i class="ri-apps-line"></i>
                        <label>Dashboard</label>
                    </button>
                </a>
                <!-- dashboard end  -->


                <!--files start  -->
                <a href="/files">
                    <button class="w-full bg-rose-400 text-white py-2.5 rounded-[4px] hover:bg-rose-600 ">
                        <i class="ri-file-line"></i>
                        <label>My Files</label>

                    </button>
                </a>
                <!--files end  -->


                <!-- history start -->
                <a href="/history">
                    <button class="w-full bg-rose-400 text-white py-2.5 rounded-[4px] hover:bg-rose-600 ">
                        <i class="ri-history-line"></i>
                        <label>History</label>

                    </button>
                </a>
                <!-- history end -->

                <!-- logout button -->
                <button class="w-full bg-rose-400 text-white py-2.5 rounded-[4px] hover:bg-rose-600 "
                    onclick="logout()">
                    <i class="ri-logout-circle-r-line"></i>
                    <label>Logout</label>
                </button>
                <!-- logout button end -->

            </div>

        </aside>

        <section id="section" style="margin-left: 250px; transition: 0.3s;">

            <!-- nav tag start  -->
            <nav class="bg-white px-6 py-4  w-full shadow-lg flex justify-between items-center">

                <!-- first div -->
                <div class="flex items-center gap-2">
                    <i class="ri-contrast-2-fill text-4xl  text-violet-700"></i>
                    <h1 class="text-2xl font-semibold ">filemoon</h1>
                </div>
                <!-- first div end -->

                <!-- second div  -->
                <div class="space-x-2">
                    <button class="bg-gray-100 px-3 py-2 rounded hover:bg-gray-200" onclick="logout()">
                        <i class="ri-logout-circle-r-line"></i>
                    </button>
                    <button class="bg-gray-100 px-3 py-2 rounded hover:bg-gray-200" onclick="toggleSidebar()">
                        <i class="ri-menu-2-line"></i>
                    </button>
                </div>
                <!-- second div end -->

            </nav>

            <div class="p-6 space-y-4">
                <h1 class="text-lg font-medium">Dashboard</h1>

                <!-- box of grid  -->
                <div id="report-card" class="grid grid-cols-4 gap-8 mb-8">

                </div>
                <!-- box of grid delete  -->


                <div class="grid grid-cols-4 gap-2">


                    <!-- recent  files box-->
                    <div
                        class="col-span-2 overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg  p-6  space-y-3">
                        <h1 class="text-lg font-semibold text-black border-b pb-3 border-gray-200">Recent Files</h1>

                        <div class="space-y-4" id="recent-files-box">

                        </div>
                    </div>

                    <!--  recent shared box  -->
                    <div
                        class="col-span-2 overflow-hidden relative bg-white rounded-lg shadow hover:shadow-lg  p-6  space-y-3">
                        <h1 class="text-lg font-semibold text-black border-b pb-3 border-gray-200">Recent shared</h1>

                        <div class="space-y-4" id="recent-shared-box">


                        </div>
                    </div>

                </div>
            </div>

        </section>

    </div>
    <script src="../JS/env.js"></script>
    <script src="../JS/layout.js"></script>
    <script src="../JS/session.js"></script>
    <script src="../JS/dashboard.js"></script>
</body>

</html>
