<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>



</head>
<body >
    <div class="bg-gray-200 min-h-screen flex  justify-center items-center animate_animated animate_fadeIn">
        <div class="p-8 w-[420px] bg-white rounded-xl flex items-center flex-col gap-8 animate_animated animate__bounce">

        <div class="flex items-center gap-2">
              <i class="ri-contrast-2-fill text-6xl  text-violet-700"></i>
              <h1 class="text-2xl font-semibold ">filemoon</h1>

        </div>

        <form  class="w-full space-y-6" onsubmit="signup(event)" >
             <div class="space-y-1">
            
                <label class="text-gray-500 text-[17px]  block">Fullname</label>
                 <input
                 name="fullname"
             class="p-3 rounded border border-gray-300 w-full"
              placeholder="Nitesh yadav" 
              required
               type="text"/>

                <div class="space-y-1">
            
                <label class="text-gray-500 text-[17px]  block">Mobile</label>
                 <input
                 name="mobile"
             class="p-3 rounded border border-gray-300 w-full"
              placeholder="123456789" 
              required
               type="number" />

            </div>

            </div>

            <div class="space-y-1">
            
                <label class="text-gray-500 text-[17px]  block">Email</label>
                 <input
                 name="email"
             class="p-3 rounded border border-gray-300 w-full"
              placeholder="email@gmail.com" 
              required
               type="email" />

            </div>
           
             <div class="space-y-1">
                <label class="text-gray-500 text-[17px]  block">password</label>
                 <input
                 name="password"
             class="p-3 rounded border border-gray-300 w-full"
              placeholder="*********" 
              required
               type="password" />

            </div>
           
           <button class="p-3 rounded border border-gray-500 w-full bg-violet-300 text-white-lg font-medium hover:bg-violet-600 ">sign up</button>
        </form>
        <div class="flex items-center gap-2">
            <p class="text-gray-500">Already have a account ?</p>
            <a href="./index.html" class="text-green-500 font-medium">Signin</a>
        </div>

        </div>
        

    </div>
    <script src="JS/signup.js"></script>
</body>
</html>
